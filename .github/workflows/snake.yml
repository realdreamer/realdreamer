name: Generate profile images

# Builds the contribution snake and the trophy cabinet inside CI and publishes
# them to the "output" branch, so the README never depends on a hosted
# rendering service being up.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4CE0B3

      # The snake step runs in Docker as root, so dist/ ends up root-owned and
      # the trophy renderer (Deno, running as the normal runner user) can't write
      # into it. Render trophies into their own folder, then copy them over.
      - name: Prepare trophy folder
        run: mkdir -p trophies

      - name: Generate trophies (dark)
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: darkhub
          output_path: trophies/trophy-dark.svg

      - name: Generate trophies (light)
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: flat
          output_path: trophies/trophy-light.svg

      - name: Collect trophies into dist/
        run: |
          sudo mkdir -p dist
          sudo cp trophies/*.svg dist/
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist

      - name: Push to the "output" branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
